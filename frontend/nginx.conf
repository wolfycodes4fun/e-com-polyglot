server {
    listen 80;
    server_name_;

    root /usr/share/nginx/html;
    index index.html;

    location /api/auth/ {
        proxy_pass http://auth:8081/;
    }

    location /api/catalog/ {
        proxy_pass http://catalog:8082/;
    }

    location /api/inventory/ {
        proxy_pass http://inventory:8083/;
    }

    location /api/orders/ {
        proxy_pass http://orders:8084/;
    }

    location /api/payments/ {
        proxy_pass http://payments:8085/;
    }

    location /api/notifications/ {
        proxy_pass http://notifications:8086/;
    }

    location /api/analytics/ {
        proxy_pass http://analytics:8087/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}