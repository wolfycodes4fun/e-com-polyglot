---
networks:
  backend-net:
    driver: bridge
services:
  catalog:
    image: catalog-service:v1
    environment:
      CATALOG_DB_DSN: "postgres://microapp:microapp123@postgres-db:5432/catalog_db?sslmode=disable"
    ports:
      - 8082:8082
    networks:
      - backend-net
  
  postgres-db:
    image: postgres:17-alpine
    networks:
      - backend-net